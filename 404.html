<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-orange: #df7b29;
            --primary-dark: #c76a1f;
            --text-dark: #1a1a1a;
            --text-muted: #555555;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background-color: #111;
        }


        .error-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }


        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: url('./asset/404.webp') center/cover no-repeat;
            animation: slowZoom 20s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes slowZoom {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.15);
            }
        }


        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8) 0%, rgba(26, 26, 26, 0.6) 100%);
            z-index: 2;
        }


        .error-card {
            position: relative;
            z-index: 3;
            background-color: var(--card-bg);
            padding: 60px 50px;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            border-top: 4px solid var(--primary-orange);
            animation: cardEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 140px;
            font-weight: 700;
            color: var(--primary-orange);
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
            text-shadow: 0 10px 25px rgba(223, 123, 41, 0.3);
            animation: pulseText 2s ease-in-out infinite;
        }

        @keyframes pulseText {

            0%,
            100% {
                transform: scale(1);
                text-shadow: 0 10px 25px rgba(223, 123, 41, 0.3);
            }

            50% {
                transform: scale(1.03);
                text-shadow: 0 15px 35px rgba(223, 123, 41, 0.5);
            }
        }


        .error-title {
            font-size: 32px;
            color: var(--text-dark);
            font-weight: 700;
            margin-bottom: 15px;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 40px;
            font-weight: 500;
        }


        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }


        .btn-primary {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: 2px solid var(--primary-orange);
            box-shadow: 0 8px 20px rgba(223, 123, 41, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(223, 123, 41, 0.4);
        }


        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
            border: 2px solid #e2e8f0;
        }

        .btn-outline:hover {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
            transform: translateY(-3px);
            background-color: #fff4ec;
        }


        .btn svg {
            width: 18px;
            height: 18px;
        }


        @media (max-width: 768px) {
            .error-card {
                padding: 40px 25px;
            }

            .error-code {
                font-size: 100px;
            }

            .error-title {
                font-size: 26px;
            }

            .error-desc {
                font-size: 14px;
                margin-bottom: 30px;
            }

            .btn-group {
                flex-direction: column-reverse;
                gap: 12px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="error-wrapper">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>

        <div class="error-card">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Lost in Transit!</h2>
            <p class="error-desc">
                Looks like this page went off the radar. It might have been relocated, removed, or the tracking link is
                invalid. Let's get you back to safety.
            </p>

            <div class="btn-group">
                <button id="goBackBtn" class="btn btn-outline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    GO Back
                </button>

                <a href="index.html" class="btn btn-primary">
                    Back to Home
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const goBackBtn = document.getElementById("goBackBtn");

            if (goBackBtn) {
                goBackBtn.addEventListener("click", function () {

                    if (window.history.length > 1) {
                        window.history.back();
                    } else {

                        window.location.href = "index.html";
                    }
                });
            }
        });
    </script>
</body>

</html>
