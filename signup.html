<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="Logistics.css">
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo-container">
            <img src="./asset/orangelogo.webp" alt="Company Logo" class="logo-img">
        </a>


        <div class="nav-collapse">
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                <li class="nav-item"><a href="services.html" class="nav-link">Services</a></li>
                <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>

            <div class="nav-buttons">
                <a href="login.html" class="btn btn-login">Login</a>
                <a href="signup.html" class="btn btn-signup">Signup</a>
            </div>
        </div>


        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>


    <section class="signup-section">
        <div class="container">

            <div class="signup-card-wrapper">


                <div class="signup-form-col" data-aos="fade-right" data-aos-duration="1000">
                    <div class="form-inner">
                        <h2 class="signup-title">Signup</h2>

                        <form id="signupForm" novalidate>


                            <div class="input-group">
                                <label for="regName">Name</label>
                                <input type="text" id="regName" placeholder="Enter your name" required>
                            </div>


                            <div class="input-group">
                                <label for="regEmail">Email</label>
                                <input type="email" id="regEmail" placeholder="Enter your email" required>
                            </div>


                            <div class="input-group">
                                <label for="regPassword">Password</label>
                                <input type="password" id="regPassword" placeholder="Enter your password" required>
                            </div>


                            <div class="input-group">
                                <label for="regConfirmPassword">Confirm Password</label>
                                <input type="password" id="regConfirmPassword" placeholder="Confirm your password"
                                    required>
                            </div>


                            <div class="checkbox-group">
                                <input type="checkbox" id="regTerms" required>
                                <label for="regTerms" id="termsLabel">I have read and agree to the <a href="#">Terms and
                                        conditions</a></label>
                            </div>


                            <div id="signupMsg" class="form-msg"></div>


                            <div class="btn-wrap">
                                <button type="submit" id="signupBtn" class="btn-signup-orange">Signup</button>
                            </div>


                            <p class="login-redirect-text">
                                Already have an account? <a href="login.html">Login</a>
                            </p>

                        </form>
                    </div>
                </div>


                <div class="signup-image-col" data-aos="fade-left" data-aos-duration="1000">
                    <div class="image-bg-zoom"></div>
                    <div class="image-overlay"></div>

                    <div class="image-text-content">
                        <h3>Create your own account</h3>
                        <p>Stackly is here to support your logistics<br>needs every step of the way</p>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <script src="main.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const signupForm = document.getElementById('signupForm');
            const formMsg = document.getElementById('signupMsg');
            const signupBtn = document.getElementById('signupBtn');


            const nameInput = document.getElementById('regName');
            const emailInput = document.getElementById('regEmail');
            const passInput = document.getElementById('regPassword');
            const confirmPassInput = document.getElementById('regConfirmPassword');
            const termsInput = document.getElementById('regTerms');
            const termsLabel = document.getElementById('termsLabel');


            const requiredInputs = [nameInput, emailInput, passInput, confirmPassInput];

            requiredInputs.forEach(input => {
                input.addEventListener('input', function () {
                    this.classList.remove('input-error', 'shake-error');
                    if (formMsg.classList.contains('error')) formMsg.style.display = 'none';
                });
            });

            termsInput.addEventListener('change', function () {
                termsLabel.classList.remove('checkbox-error');
                if (formMsg.classList.contains('error')) formMsg.style.display = 'none';
            });


            signupForm.addEventListener('submit', function (e) {
                e.preventDefault();

                let isValid = true;
                let errorMessage = 'Please check the highlighted fields correctly.';

                formMsg.className = 'form-msg';
                formMsg.style.display = 'none';


                if (nameInput.value.trim() === '') {
                    triggerError(nameInput);
                    isValid = false;
                }


                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(emailInput.value.trim())) {
                    triggerError(emailInput);
                    isValid = false;
                }


                if (passInput.value.trim().length < 6) {
                    triggerError(passInput);
                    isValid = false;
                    errorMessage = 'Password must be at least 6 characters.';
                }


                if (confirmPassInput.value.trim() === '') {
                    triggerError(confirmPassInput);
                    isValid = false;
                } else if (passInput.value !== confirmPassInput.value) {
                    triggerError(passInput);
                    triggerError(confirmPassInput);
                    isValid = false;
                    errorMessage = 'Passwords do not match!';
                }


                if (!termsInput.checked) {
                    termsLabel.classList.add('checkbox-error');
                    isValid = false;
                }


                if (!isValid) {
                    formMsg.innerText = errorMessage;
                    formMsg.classList.add('error');
                    formMsg.style.display = 'block';
                    return false;
                }


                formMsg.innerText = 'Account Created! Redirecting to login...';
                formMsg.classList.add('success');
                formMsg.style.display = 'block';


                signupBtn.innerText = "Processing...";
                signupBtn.style.backgroundColor = "#2e7d32";
                signupBtn.style.pointerEvents = "none";


                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            });


            function triggerError(element) {
                element.classList.remove('shake-error');
                void element.offsetWidth;
                element.classList.add('input-error', 'shake-error');
            }
        });
    </script>

</body>

</html>
